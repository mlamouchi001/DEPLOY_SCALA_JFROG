---
# Variante Vault de deploy.yml : memes etapes, plus le fichier de configuration Vault (AppRole).
# Fichier, hotes et variables inchanges : le projet AWX et ses job templates restent tels quels.
- name: "Deploy Scala Project on EDGE"
  hosts: edges,edge_lucid
  vars_files:
    - "group_vars/{{ env }}/{{ env }}.yml"
    - "group_vars/global.yml"
  vars:
    # Comportement historique de ce playbook : bundle zip toujours traite, jar et scripts toujours copies sur HDFS.
    playbook_bundle_default: "true"
    playbook_hdfs_default: "true"
    # Emplacement historique du fichier Vault : <path_principal_deploy>/<irt_trigram>/<path_conf>/<file_conf>
    playbook_vault_legacy_layout: true
  tasks:
    - name: "Deploy Scala project with Vault configuration"
      include_tasks: tasks/deploy_scala.yml
