---
# Deploiement d'un projet Scala sur les edges : jar (et bundle zip) telecharges depuis JFrog,
# installes dans <path_principal_deploy>/<irt_trigram>/<env>/<path_source>/{bin,sh,conf}, copie HDFS en option.
# Fichier, hotes et variables inchanges : le projet AWX et ses job templates restent tels quels.
# Le detail des taches est dans tasks/deploy_scala.yml, partage avec deploy_vault.yml.
- name: "Deploy Scala Project on EDGE"
  hosts: edges,edge_lucid
  vars_files:
    - "group_vars/{{ env }}/{{ env }}.yml"
    - "group_vars/global.yml"
  vars:
    # Comportement historique de ce playbook :
    # - le bundle zip (scripts, conf) n'est traite que si only_jar == "true" (nom trompeur, conserve tel quel ;
    #   deploy_bundle=true|false permet de le dire explicitement) ;
    # - la copie HDFS du jar et des scripts depend de deploy_hdfs.
    playbook_bundle_default: "{{ only_jar | default('true') }}"
    playbook_hdfs_default: "{{ deploy_hdfs | default('false') }}"
    # vault.conf (extra vars vault_conf_b64, ou approle_id / approle_secret) : depose dans le dossier conf/ de
    # l'application, la ou le script de lancement le cherche.
    playbook_vault_legacy_layout: false
  tasks:
    - name: "Deploy Scala project"
      include_tasks: tasks/deploy_scala.yml
